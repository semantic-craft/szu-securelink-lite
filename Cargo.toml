[workspace]
members = [".", "crates/host-macos"]

[package]
name = "szu-securelink-rs"
version = "0.2.2"
edition = "2024"
description = "Pure-Rust Zero-Trust tunnel core and native macOS AppKit host for SZU SecureLink"
license = "MIT"
default-run = "szu-securelink"

[lib]
name = "szu_securelink_rs"
path = "src/lib.rs"

[[bin]]
name = "szu-securelink"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
szu-host-macos = { path = "crates/host-macos" }
tray-icon = "0.26.1"
